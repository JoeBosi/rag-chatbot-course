extra_css:
  - assets/extra.css

extra:
  # Il piede di pagina lo scriviamo noi in overrides/partials/copyright.html
  generator: false
  social:
    - icon: material/school
      link: https://corso-rag.giuseppebosi.com/
      name: Costruisci la tua memoria AI


