site_name: Costruisci la tua memoria AI
site_description: Corso pratico di 20 ore su RAG, grafi di conoscenza e chatbot che ricordano. A costo zero.
site_author: Giuseppe Bosi
site_url: https://corso-rag.giuseppebosi.com/

docs_dir: build/docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: it
  custom_dir: overrides
  # Nessun font da Google: il tema userebbe fonts.googleapis.com, cioe'
  # una richiesta a terzi per ogni lettore. Con false usa i caratteri di
  # sistema, e il sito non contatta nessuno.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Collegamento a questa sezione
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: it

extra_css:
  - assets/extra.css

extra:
  # Il piede di pagina lo scriviamo noi in overrides/partials/copyright.html
  generator: false
  social:
    - icon: material/school
      link: https://corso-rag.giuseppebosi.com/
      name: Costruisci la tua memoria AI


