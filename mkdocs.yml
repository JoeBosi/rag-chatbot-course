site_name: Costruisci la tua memoria AI
site_description: Corso pratico di 20 ore su RAG, grafi di conoscenza e chatbot che ricordano. A costo zero.
site_author: Giuseppe Bosi
site_url: https://corso-rag.giuseppebosi.com/

docs_dir: build/docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: it
  custom_dir: overrides
  # Nessun font da Google: il tema userebbe fonts.googleapis.com, cioe'
  # una richiesta a terzi per ogni lettore. Con false usa i caratteri di
  # sistema, e il sito non contatta nessuno.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Collegamento a questa sezione
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: it
  # Corso bilingue: pagina.md in italiano (URL invariati), pagina.en.md
  # in inglese sotto /en/. Le pagine non tradotte ricadono sull'italiano.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          default: true
          name: Italiano
          build: true
        - locale: en
          name: English
          build: true
          site_name: Build your own AI memory
          site_description: A free, hands-on 20-hour RAG chatbot course in Python. Build a personal AI memory with cognee, knowledge graphs and free LLM APIs, at zero cost.
          nav_translations:
            Il corso: The course
            Prima di cominciare: Before you start
            Preparare il computer: Set up your computer
            Prendere le chiavi: Get your API keys
            Glossario: Glossary
            I moduli: Modules
            "1 — Perché serve una memoria": "1 — Why you need a memory"
            "Modulo 1: Perché serve una memoria": "Module 1: Why you need a memory"
            "Modulo 1: laboratorio": "Module 1: lab"
            "2 — Chiavi, gateway e quote": "2 — Keys, gateway and quotas"
            "Modulo 2: Chiavi, gateway e quote": "Module 2: Keys, gateway and quotas"
            "Modulo 2: laboratorio": "Module 2: lab"
            "3 — Come un testo diventa cercabile": "3 — How a text becomes searchable"
            "Modulo 3: Come un testo diventa cercabile": "Module 3: How a text becomes searchable"
            "Modulo 3: laboratorio": "Module 3: lab"
            "4 — Dal recupero al grafo": "4 — From retrieval to the graph"
            "Modulo 4: Dal recupero al grafo": "Module 4: From retrieval to the graph"
            "Modulo 4: laboratorio": "Module 4: lab"
            "5 — La pipeline di cognee": "5 — The cognee pipeline"
            "Modulo 5: La pipeline di cognee": "Module 5: The cognee pipeline"
            "Modulo 5: laboratorio": "Module 5: lab"
            "6 — Dove vive il dato": "6 — Where the data lives"
            "Modulo 6: Dove vive il dato": "Module 6: Where the data lives"
            "Modulo 6: laboratorio": "Module 6: lab"
            "7 — Manutenzione della memoria": "7 — Memory maintenance"
            "Modulo 7: Manutenzione della memoria": "Module 7: Memory maintenance"
            "Modulo 7: laboratorio": "Module 7: lab"
            "8 — Valutare il proprio sistema": "8 — Evaluating your system"
            "Modulo 8: Valutare il proprio sistema": "Module 8: Evaluating your system"
            "Modulo 8: laboratorio": "Module 8: lab"
            Progetto finale: Final project
            Il brief: The brief
            Come ti valuti: How you assess yourself
            Il corpus di partenza: The starter corpus (Italian)
            "Caldaia Termovex TX-24": "Boiler Termovex TX-24"
            "Lavatrice Lavanor WM-700": "Washing machine Lavanor WM-700"
            "Avvitatore Ferrex ID-18": "Drill driver Ferrex ID-18"
            "Bici Velomonte Trail 275": "Bike Velomonte Trail 275"
            "Rasaerba Greencut RM-46": "Lawn mower Greencut RM-46"
            "Nota 12/03 — caldaia E4": "Note 03/12 — boiler E4"
            "Nota 02/04 — lavatrice F03": "Note 04/02 — washing machine F03"
            "Nota 18/05 — avvitatore": "Note 05/18 — drill driver"
